name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Chat_App.sln -c Release --nologo

  unit:
    name: Unit Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test UnitTests -c Release --nologo

  protocol:
    name: Protocol Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Protocol.Tests -c Release --nologo

  integration:
    name: Integration Tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test IntegrationTests -c Release --nologo

  migration:
    name: Migration Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test IntegrationTests -c Release --nologo --filter "FullyQualifiedName~MigrationUpgradeMatrixTests"

  allocation-budget:
    name: Allocation Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test Protocol.Tests -c Release --nologo --filter "FullyQualifiedName~AllocationBudgetTests"

  performance:
    name: Performance Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # 基准 JSON → 与基线比较 → 超过允许回归比例（20%）→ CI 失败。
      # 基线必须与 CI 同环境（ubuntu）生成：见 Benchmarks/baseline.json 环境标注。
      - run: dotnet run -c Release --project Benchmarks -- --filter "*" --job Short --exporters JSON --artifacts "$RUNNER_TEMP/bench"
      - run: python3 .github/scripts/compare_benchmarks.py "$RUNNER_TEMP/bench" Benchmarks/baseline.json 0.20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: ${{ runner.temp }}/bench

  analyzers:
    name: Analyzers (warnaserror)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # CS0067（测试桩接口事件未使用）排除：接口强制实现但桩不触发属预期；
      # 其余警告（nullable 等）一律视为错误
      - run: dotnet build Chat_App.sln -c Release --nologo -warnaserror -p:WarningsNotAsErrors=CS0067

  format:
    name: Code Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # 全新 runner 无 project.assets.json：先 restore 再 verify
      - run: dotnet restore Chat_App.sln --nologo
      # 只校验本次变更的 .cs 文件：仓库存在历史格式债务（未跑过 dotnet format），
      # 全量校验会因存量违规失败；门禁只拦"新引入"的格式问题。
      - name: Verify format of changed files
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD~1)"; fi
          changed=$(git diff --name-only "$base"...HEAD -- '*.cs' | tr '\n' ' ')
          if [ -z "$changed" ]; then
            echo "no changed .cs files to verify"
            exit 0
          fi
          dotnet format Chat_App.sln --verify-no-changes --no-restore --include $changed

  vulnerability-scan:
    name: Package Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # dotnet list 发现漏洞时退出码不可靠：输出 JSON 并显式按严重等级判定
      - name: Scan and gate on vulnerabilities
        shell: bash
        run: |
          dotnet list Chat_App.sln package --vulnerable --include-transitive --format json > "$RUNNER_TEMP/vuln.json" 2>/dev/null || true
          python3 - <<EOF
          import json
          path = "$RUNNER_TEMP/vuln.json"
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          vulnerable = []
          for proj in data.get("projects", []):
              for fw in proj.get("frameworks", []):
                  for pkg in fw.get("topLevelPackages", []) + fw.get("transitivePackages", []):
                      for vuln in pkg.get("vulnerabilities", []):
                          sev = vuln.get("severity", "")
                          vulnerable.append((pkg.get("name"), sev, vuln.get("advisoryurl")))
          if vulnerable:
              for name, sev, url in vulnerable:
                  print(f"VULNERABLE: {name} [{sev}] {url}")
              raise SystemExit(1)
          print("no known vulnerabilities")
          EOF
